<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title></title>
</head>
<body>
    <head>
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid d-flex justify-content-between">
            <h1>Dulce Rubor </h1>
            <div>
                <i class="bi bi-cart" id="icono-carrito"></i>
                <span id="contadorCorrito" class="badge text-bg-secondary">0</span> 
            </div>
            </div>
        </nav>


    </head>
    <main>
        <section>
        <div class="container">
            <div class="row">

                <div class="col-md-3">
                        <div class="card" style="width: 13rem;">
                            <img src="BROCHAS SAMYx10und SET SOFT GLAM.png" class="card-img-top" alt="BROCHAS SET">
                            <div class="card-body">
                                <h5 class="card-title">BROCHAS SET</h5>
                                <p class="card-text">
                                Es un kit completo diseñado para lograr un maquillaje
                                profesional de forma fácil y uniforme.
                                </p>
                                <div class="botPr">
                                    <span class="precio">75.500</span>
                                    <button type="button" class="btn-agregar" data-nombre="BROCHAS SET" data-precio="75500" >Agregar</button>
                                </div>
                            </div>
                        </div>
               </div>
                <div class="col-md-3">
                    <div class="card" style="width: 13rem;">
                        <img src="FIJADOR MAQUILLAJE MONTOCx30ml DIXY FIX.png" class="card-img-top" alt="FIJADOR MAQUILLAJE">
                        <div class="card-body">
                            <h5 class="card-title">FIJADOR MAQUILLAJE</h5>
                            <p class="card-text">
                                Es una bruma ligera diseñada para sellar el maquillaje y
                                mantenerlo intacto durante todo el día.
                            </p>
                            <div class="botPr">
                                <span class="precio">23.000</span>
                                <button type="button" class="btn-agregar" data-nombre="FIJADOR MAQUILLAJE" data-precio="23000">Agregar</button>
                            </div>
                        </div>
                   </div>
               </div>
            </div>
        </div>

        </section>
      
         <section class="cantainer mt-4">
            <h3>Carrito</h3>
            <ul id="lista-carrito" class="list-group"> <li id="mensageVacio" style="display: none;">Tu carrito está vacío</li></ul>
            <p class="totalC">Total: <span id="precioTotal">0</span></p>
            <button id="botonVaciar" class="btn btn-danger">Vaciar carrito</button>

        
        </div>
      </div>
        </section>
            
       
    </main>
    <footer>

    </footer>

    <script src="./js/app.js"></script>
</body>
</html>
