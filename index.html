<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="css/styles.css" rel="stylesheet">
    <title>PowerZone</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">

            <a class="navbar-brand neon-logo" href="/">
                PowerZone
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContenido">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="#inicio">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#categorias">Categorías</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#productos">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#carrito">Carrito</a>
                    </li>
                </ul>

                <div class="d-flex">
                    <button class="btn bg-white position-relative">
                        🛒
                        <span id="badge" 
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            0
                        </span>
                    </button>
                </div>

            </div>
        </div>
    </header>
    <main>
        <section class="container mt-5">

        <div id="carouselExampleCaptions" class="carousel slide carousel-fade custom-carousel" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
                    aria-current="true"></button>
                <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"></button>
              
            </div>

            <div class="carousel-inner rounded-5 shadow-lg">
                <div class="carousel-item active">
                    <img src="Fut-Balon.png" class="d-block w-100" alt="Despulpado">
                    <div class="carousel-caption">
                        <h5 class="fw-bold">TU PASIÓN, NUESTRO IMPULSO</h5>
                        <p>Explora nuestro catálogo.</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="Run-Nat.png" class="d-block w-100" alt="Manos y Café">
                    <div class="carousel-caption">
                     <h5 class="fw-bold">DOMINA CADA ELEMENTO</h5>
        <p>Rendimiento sin fronteras, en tierra o agua.</p>
                    </div>
                </div>

               
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>

        </section>
        <section>

        </section>
    </main>
    <footer class="text-white mt-5">
        <div class="container py-4">

            <div class="row text-center text-md-start">

                <div class="col-12 col-md-4 mb-3">
                    <h5>Síguenos</h5>
                    <div class="d-flex justify-content-center justify-content-md-start gap-3 mt-2">
                        <a class="text-white" href="https://www.linkedin.com/">
                            <i class="fa-brands fa-linkedin fa-2x"></i>
                        </a>
                        <a class="text-white" href="https://www.instagram.com/?hl=es">
                            <i class="fa-brands fa-instagram fa-2x"></i>
                        </a>
                    </div>
                </div>

                <div class="col-12 col-md-4 mb-3">
                    <h5>Contacto</h5>
                    <p class="mb-1">PowerZone@gmail.com</p>
                </div>

                <div class="col-12 col-md-4 mb-3">
                    <h5>Legal</h5>
                    <p class="mb-1">Todos los derechos reservados</p>
                    <p class="mb-0">© 2026 PowerZone</p>
                </div>

            </div>

        </div>
    </footer>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
