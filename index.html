<head>

<!-- /* Bootstrap Iconos*/ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .carrito-sidebar {
            background: #f8f9fa;
            padding: 20px;

            margin-top: 30px;
        }
        #lista-Compra {
            max-height: 300px;
            overflow-y: auto;
        }
        .eliminar-item {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <head>
<!-- /*Ivan*/ -->
    </head>
    <main>
        <section>
<!-- /*Maira*/ -->
        </section>
        <section>
<!-- /*leider*/ -->
        </section>
        <section class="py-5">
            <div class="container">
                <h2 class="text-center mb-5">Productos</h2>
<!-- /* Categoría: Baloncesto */ -->
                <h3 class="mb-4">🏀 Baloncesto</h3>
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4 mb-5">
                    
                </div>

<!-- /* Categoría: Fútbol */ -->
                <h3 class="mb-4">⚽ Fútbol</h3>
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4 mb-5">

<!-- /* Categoría: Natación */ -->
                <h3 class="mb-4">🏊 Natación</h3>
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4 mb-5">

                <span>Total productos: <span id="contador-Compra">0</span></span>
                <button id="vaciar-Compra" class="btn btn-danger btn-sm">Vaciar compra</button>
            </div>
            <ul id="lista-Compra" class="list-group mt-3">
                <li class="list-group-item">Tu compra está vacía</li>
            </ul>
            <div class="mt-3 fw-bold">
                Total a pagar: <span id="total-Compra">$0</span>
